# This rule is not used by the project kube-operator2dir itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ops.operator2dir.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kube-operator2dir
    app.kubernetes.io/managed-by: kustomize
  name: dirtree-editor-role
rules:
- apiGroups:
  - ops.operator2dir
  resources:
  - dirtrees
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ops.operator2dir
  resources:
  - dirtrees/status
  verbs:
  - get
